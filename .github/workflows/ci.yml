name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The runtime currently supports the Python versions exercised here.
        # Python 3.10 uses APIs introduced in 3.11, while the locked ChromaDB
        # dependency chain has no CPython 3.14 on the supported platforms.
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra mcp --group dev
      - run: uv run python -m pytest -q

  contracts:
    name: contracts-lock-migrations-mcp
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          python-version: "3.12"
      - run: uv lock --check
      - run: uv export --frozen --extra mcp --group dev --format requirements-txt --no-emit-project --output-file requirements.txt
      - run: git diff --exit-code -- requirements.txt
      - run: uv sync --frozen --extra mcp --group dev
      - run: uv run python -m scripts.verify_import_manifest tests/fixtures/official_formats
      - run: uv run python -m scripts.validate_official_samples
      - run: uv run python -m scripts.verify_contracts
      - run: uv run python -m scripts.verify_methodology_registry
      - run: uv run python -m pytest tests/test_mcp_integration.py tests/test_provider_profiles.py tests/test_reproducibility.py -q

  performance:
    name: performance-100k-baseline
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      LOKY_MAX_CPU_COUNT: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen --extra mcp --group dev
      - run: uv run python -m scripts.benchmark_retrieval --records 100000
      - run: uv run python -m scripts.benchmark_tool_runtime --records 100000

  frontend:
    name: frontend-node-20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
