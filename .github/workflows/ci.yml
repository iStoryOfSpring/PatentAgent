name: quality-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend-python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra mcp --group dev
      - run: uv run python -m pytest -q

  contracts:
    name: contracts-lock-migrations-mcp
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          python-version: "3.12"
      - run: uv lock --check
      - run: uv export --frozen --extra mcp --group dev --format requirements-txt --no-emit-project --output-file requirements.txt
      - run: git diff --exit-code -- requirements.txt
      - run: uv sync --frozen --extra mcp --group dev
      - run: uv run python -m pytest tests/test_mcp_integration.py tests/test_provider_profiles.py tests/test_reproducibility.py -q

  frontend:
    name: frontend-node-20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
