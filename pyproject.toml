[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patentagent"
version = "3.0.0"
description = "Traceable patent analysis with FastAPI, React and MCP"
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "pyarrow>=14", "scipy>=1.10",
  "scikit-learn>=1.3", "networkx>=3", "nltk>=3.8", "jieba>=0.42.1",
  "pyecharts>=2", "pydantic>=2", "fastapi>=0.115", "uvicorn>=0.30",
  "httpx>=0.25", "anthropic>=0.30", "openai>=1", "chromadb>=0.4",
  "aiosqlite>=0.19",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
mcp = ["mcp>=1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
