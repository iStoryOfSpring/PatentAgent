[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patentagent"
version = "3.1.0"
description = "Traceable patent analysis with FastAPI, React and MCP"
authors = [
  {name = "Wu Jinhong"},
  {name = "Chen Siyu"},
]
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3", "numpy>=1.24,<2.3", "pyarrow>=14,<26", "scipy>=1.10,<1.16",
  "scikit-learn>=1.3,<1.8", "networkx>=3,<3.5", "nltk>=3.8,<4", "jieba>=0.42.1,<1",
  "pyecharts>=2,<3", "pydantic>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "httpx>=0.25,<1", "anthropic>=0.30,<1", "openai>=1,<3", "chromadb>=0.4,<2",
  "onnxruntime>=1.17,<1.24; python_version < '3.11'",
  "aiosqlite>=0.19",
  "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
mcp = ["mcp>=1,<2"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["server", "mcp_server", "mcp_http_server"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agent*", "compat*", "engine*", "models*", "patent_agent*",
  "patent_mcp*", "reporting*", "retrieval*", "storage*", "tools*", "viz*",
]
exclude = ["tests*", "frontend*"]
